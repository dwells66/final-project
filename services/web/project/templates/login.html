{% extends "base.html" %}

{% block content %}

<h2>Login Webpage</h2>

{% if bad_credentials %}
    <p style="color: red;">
        ERROR: Credentials are incorrect
    </p>
{% endif %}

<form action="/login" method="POST">
    <table>

        <tr>
            <td>Username</td>
            <td>
                <input type="text" name="username" required>
            </td>
        </tr>

        <tr>
            <td>Password</td>
            <td>
                <input type="password" name="password" required>
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Login">
            </td>
        </tr>

    </table>
</form>

{% endblock %}
