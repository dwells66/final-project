version: '3.8'

services:
  web:
    build: ./services/web
    command: python manage.py run -h 0.0.0.0
    volumes:
      - ./services/web/:/usr/src/app/
    ports:
      - 1202:5000
    env_file:
      - ./.env.dev
    depends_on:
      - db
  db:
    build: ./services/db
    volumes:
      - $HOME/bigdata/pg_normalized_batch:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass
      - PGUSER=postgres

volumes:
  postgres_data:
